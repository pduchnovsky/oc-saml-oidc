name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Python version from Dockerfile
        id: python
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)-.*$/\1/p' Dockerfile)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: python -m pip install --group lint

      - name: Run Ruff checks
        run: |
          ruff check --no-fix src tests
          ruff format --check src tests

      - name: Run mypy
        run: mypy --config-file pyproject.toml

      - name: Run codespell
        run: codespell .

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(path.read_text())
          PY

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag omada-saml-oidc:test .

      - name: Run full test suite with coverage inside image
        run: |
          docker run --rm --entrypoint sh \
            --volume "$PWD/tests:/app/tests:ro" \
            omada-saml-oidc:test -c \
            'command -v xmlsec1 && python -m pip install --group pytest && python -m pytest -o cache_dir=/tmp/pytest-cache'
